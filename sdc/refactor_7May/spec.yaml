openapi: 3.1.0
info:
  title: SDC Platform — Workato Recipe Specification
  version: 1.0.0
  description: 'Machine- and human-readable specification of the Supplier Data Collection (SDC) Workato
    application, derived directly from recipe JSON.


    Entry points appear under `paths`: API Platform HTTP endpoints (`x-trigger-type: api_platform_http`,
    secured by the API-TOKEN header) and Workato webhooks (`x-trigger-type: workato_webhook`, secured
    by the webhook URL suffix). Other recipes are internal: callable recipe functions (invoked via `call_recipe`),
    Workflow App functions (invoked by the WFA portal runtime; see `wfa_function_type` = generic / load_table
    / load_dropdown), and data-table real-time triggers (`x-trigger-type: data_table_realtime`, fired
    by row changes — see `trigger_table`). Every recipe is fully described under the `x-recipes` vendor
    extension and shares request/response object schemas in `components/schemas`.


    Covers all 43 supplied recipes (complete set). The call graph is closed except for one call in PRV-04
    made against a raw workspace-local flow ID (`flow_id:2066426`, passing only template_version_id) that
    cannot be resolved from recipe JSON and should be repackaged as a named reference. Two recipes share
    the prefix WFA-13 (disambiguated with a `--<slug>` suffix, flagged `code_collision: true`); renumber
    at source.


    Note on columns: data-table actions reference columns by UUID only; column names live in the table
    definition files (not in recipe JSON), so tables are documented by name + read/write/trigger access.'
tags:
- name: Provisioning
- name: Validation & Preview
- name: Canonical Model
- name: Seed & Integration
- name: Invitation
- name: Upload & Intake
- name: Review
- name: State Machine
- name: Supplier Lifecycle
- name: Dashboard
- name: Observability
- name: Utilities
- name: Workflow App (Portal)
paths:
  /sdc/provisioning:
    post:
      operationId: API-00
      tags:
      - Provisioning
      summary: API-00 — Provisioning
      security:
      - ApiToken: []
      x-path-source: API Platform collection (not in recipe JSON); path shown is indicative
      x-recipe: '#/x-recipes/API-00'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/API-00_Request'
      responses:
        '504':
          description: 504 - Gateway Timeout
        '200':
          description: 200 - OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_details:
                    type: object
                    properties:
                      correlation_id: {}
                      config_json_file_id: {}
                      analyst_email: {}
                      timestamp: {}
                      payload_version: {}
                  workato_job_url: {}
                  send_invitations:
                    type: object
                    properties:
                      ready: {}
                  parse_summary:
                    type: object
                    properties:
                      field_count: {}
                      visible_field_count: {}
                      rule_count: {}
                      lookup_count: {}
                      variant_count: {}
                      supplier_count: {}
                      user_count: {}
                      error_translation_count: {}
                      skipped_rows:
                        type: object
                        properties:
                          fields: {}
                          lookups: {}
                          suppliers: {}
                          users: {}
                      warnings:
                        type: object
                        properties:
                          sheet: {}
                          row: {}
                          issue: {}
                  validate_summary:
                    type: object
                    properties:
                      status: {}
                      error_count: {}
                      warning_count: {}
                      checks:
                        type: object
                        properties:
                          check_name: {}
                          status: {}
                          message: {}
                      warnings:
                        type: object
                        properties:
                          check_name: {}
                          message: {}
                          details:
                            type: object
                            properties:
                              entity: {}
                              name: {}
                              issue: {}
                          c_status: {}
                  seed_data:
                    type: object
                    properties:
                      required: {}
                      ok: {}
        '500':
          description: 500 - Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_details:
                    type: object
                    properties:
                      correlation_id: {}
                      config_json_file_id: {}
                      analyst_email: {}
                      timestamp: {}
                      payload_version: {}
                  workato_job_url: {}
                  error_details:
                    type: object
                    properties:
                      errored_action: {}
                      errored_step: {}
                      error_message: {}
                      failed_recipe_url: {}
        '400':
          description: 400 - Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_details:
                    type: object
                    properties:
                      correlation_id: {}
                      config_json_file_id: {}
                      analyst_email: {}
                      timestamp: {}
                      payload_version: {}
                  workato_job_url: {}
                  error_details:
                    type: object
                    properties:
                      errored_action: {}
                      errored_step: {}
                      failed_recipe_url: {}
                      error_message: {}
  /sdc/preview-template:
    post:
      operationId: API-01
      tags:
      - Validation & Preview
      summary: API-01 — Preview template
      security:
      - ApiToken: []
      x-path-source: API Platform collection (not in recipe JSON); path shown is indicative
      x-recipe: '#/x-recipes/API-01'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/API-01_Request'
      responses:
        '200':
          description: 200 - OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {}
                  verdict:
                    type: object
                    properties:
                      status: {}
                      error_count: {}
                      warning_count: {}
                      checks:
                        type: object
                        properties:
                          check_name: {}
                          c_status: {}
                          message: {}
                          details:
                            type: object
                            properties:
                              entity: {}
                              name: {}
                              issue: {}
                  file_content: {}
                  suggested_filename: {}
                  metadata:
                    type: object
                    properties:
                      byte_size: {}
                      sheet_names: {}
                      field_count: {}
                      row_count: {}
        '400':
          description: 400 - Bad Request
  /sdc/validate-configuration:
    post:
      operationId: API-02
      tags:
      - Validation & Preview
      summary: API-02 — Validate configuration
      security:
      - ApiToken: []
      x-path-source: API Platform collection (not in recipe JSON); path shown is indicative
      x-recipe: '#/x-recipes/API-02'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/API-02_Request'
      responses:
        '200':
          description: 200 - OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {}
                  verdict:
                    type: object
                    properties:
                      error_count: {}
                      warning_count: {}
                      checks:
                        type: object
                        properties:
                          check_name: {}
                          c_status: {}
                          message: {}
                          details:
                            type: object
                            properties:
                              entity: {}
                              name: {}
                              issue: {}
                      status: {}
        '400':
          description: 400 - Bad Request
  /webhooks/issue-invitations:
    post:
      operationId: R-1
      tags:
      - Invitation
      summary: R-1 — Issue invitations to the Workflow App
      x-trigger-type: workato_webhook
      x-auth-note: Authenticated by the unguessable Workato webhook URL (suffix), not API-TOKEN
      x-recipe: '#/x-recipes/R-1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/R-1_Request'
      responses:
        '200':
          description: Event accepted (webhook trigger; no response body returned to caller)
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: API-TOKEN
  schemas:
    API-00_Request:
      type: object
      properties:
        correlation_id:
          type: string
        client_name:
          type: string
        analyst_email:
          type: string
        target_vms:
          type: string
        config_file_id:
          type: string
        drive_id_config_json:
          type: string
        template_file_ids:
          type: array
        application_name:
          type: array
        is_initial:
          type: boolean
        output_drive_folder_id:
          type: string
        reminder_days_1:
          type: number
        reminder_days_2:
          type: number
        reminder_days_3:
          type: number
        supplier_instructions:
          type: string
        timestamp:
          type: string
          format: date-time
        payload_version:
          type: string
        kick_off_email_body:
          type: string
        has_seeded_data:
          type: boolean
        seeded_data_drive_id:
          type: string
        seeded_data_index_key:
          type: string
        seeded_data_sheet_name:
          type: string
    API-01_Request:
      type: object
      properties:
        correlation_id:
          type: string
        config_json_file_id:
          type: string
        requester_email:
          type: string
        variant_id:
          type: string
        timestamp:
          type: string
          format: date-time
        payload_version:
          type: string
    API-02_Request:
      type: object
      properties:
        correlation_id:
          type: string
        config_json_file_id:
          type: string
        requester_email:
          type: string
        variant_id:
          type: string
        timestamp:
          type: string
          format: date-time
        payload_version:
          type: string
    R-1_Request:
      type: object
      properties:
        analyst_email:
          type: string
        ssId:
          type: string
    LNK-01_Request:
      type: object
      properties:
        supplier_request_id:
          type: string
        file_storage_path:
          type: string
      required:
      - supplier_request_id
      - file_storage_path
    LNK-01_Response:
      type: object
      properties:
        refreshed_link:
          type: string
    WFA-01_Request:
      type: object
      properties:
        supplier_request_id:
          type: string
        supplier_id:
          type: string
        validation_result_id:
          type: string
    WFA-01_Response:
      type: object
      properties:
        supplier_name:
          type: string
        customer_name:
          type: string
        analyst_email:
          type: string
        validation_report_path:
          type: string
        last_upload_path:
          type: string
        review_note_from_analyst:
          type: string
        instructions:
          type: string
      required:
      - supplier_name
    WFA-02_Request:
      type: object
      properties:
        supplier_name:
          type: string
        due_date:
          type: string
          format: date-time
        supplier_request_id:
          type: string
        client_name:
          type: string
        template_download_url:
          type: string
        link_to_approved_upload:
          type: string
        link_to_report:
          type: string
        status:
          type: string
        supplier_message:
          type: string
      required:
      - supplier_name
      - supplier_request_id
      - client_name
    WFA-02_Response:
      type: object
      properties:
        client:
          type: string
        due_date:
          type: string
          format: date-time
        link_to_file_storage:
          type: string
        link_to_submission:
          type: string
        validation_report:
          type: string
        status:
          type: string
        supplier_message:
          type: string
      required:
      - client
    WFA-03_Response:
      type: object
      properties:
        category:
          type: string
        supplier_id:
          type: string
        supplier_name:
          type: string
        subject:
          type: string
        detail:
          type: string
    WFA-05_Request:
      type: object
      properties:
        supplier_request_id:
          type: string
      required:
      - supplier_request_id
    WFA-05_Response:
      type: object
      properties:
        upload_time:
          type: string
          format: date-time
        template_version:
          type: string
        submitted_path:
          type: string
        extracted_path:
          type: string
        status:
          type: string
        validation_status:
          type: string
        validation_valid_row_count:
          type: integer
        validation_invalid_row_count:
          type: integer
        validation_report_path:
          type: string
        validation_result_time:
          type: string
          format: date-time
    WFA-06_Request:
      type: object
      properties:
        response:
          type: string
        supplier_request_id:
          type: string
        review_note_text:
          type: string
        analyst_email:
          type: string
    WFA-07_Request:
      type: object
      properties:
        supplier_request_id:
          type: string
        supplier_id:
          type: string
        validation_result_id:
          type: string
    WFA-07_Response:
      type: object
      properties:
        supplier_name:
          type: string
        customer_name:
          type: string
        analyst_email:
          type: string
        path_upload:
          type: string
          description: Path to the upload in FileStorage
        path_validation_report:
          type: string
          description: Path to validation report in FileStorage
    WFA-08B_Response:
      type: object
      properties:
        supplier_name:
          type: string
        supplier_id:
          type: string
        request_id:
          type: string
    WFA-09_Request:
      type: object
      properties:
        email_address:
          type: string
        supplier_id:
          type: string
        supplier_name:
          type: string
          description: If a request exists for the supplier, this field will include the supplier_request_id
            in parenthesis following the supplier name.
        supplier_user_name:
          type: string
        role:
          type: string
          description: 'enum: primary | secondary'
        analyst_email:
          type: string
      required:
      - email_address
      - supplier_id
      - supplier_name
      - analyst_email
    WFA-09_Response:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        disposition:
          type: string
        role_assigned:
          type: string
        supplier_request_id:
          type: string
        supplier_user_id:
          type: string
      required:
      - ok
    WFA-10_Request:
      type: object
      properties:
        email_address:
          type: string
      required:
      - email_address
    WFA-10_Response:
      type: object
      properties:
        result:
          type: string
      required:
      - result
    WFA-13--populate-request-details_Request:
      type: object
      properties:
        supplier_request_id:
          type: string
      required:
      - supplier_request_id
    WFA-13--populate-request-details_Response:
      type: object
      properties:
        supplier_name:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
      required:
      - supplier_name
      - created_at
    WFA-13--populate-results-table-supplier-facing_Request:
      type: object
      properties:
        supplier_request_id:
          type: string
      required:
      - supplier_request_id
    WFA-13--populate-results-table-supplier-facing_Response:
      type: object
      properties:
        status:
          type: string
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        upload_datetime:
          type: string
          format: date-time
    CAN-01_Request:
      type: object
      properties:
        parsed_config_json:
          type: string
        template_version_id:
          type: string
        version_number:
          type: integer
        project_id:
          type: string
        expected_sheet_name:
          type: string
          description: Default, "Data"
      required:
      - parsed_config_json
      - template_version_id
      - version_number
      - project_id
    CAN-01_Response:
      type: object
      properties:
        canonical_model_json:
          type: string
        meta:
          type: object
          properties:
            template_version_id:
              type: string
            version_number:
              type: integer
            project_id:
              type: string
            expected_sheet_name:
              type: string
            built_at:
              type: string
            built_by_recipe:
              type: string
        summary:
          type: object
          properties:
            field_count:
              type: integer
            visible_field_count:
              type: integer
            rule_count:
              type: integer
            lookup_value_count:
              type: integer
            unique_lookup_name_count:
              type: integer
            variant_count:
              type: integer
            variant_field_count:
              type: integer
            form_slot_count:
              type: integer
            error_message_count:
              type: integer
            slot_pool_usage:
              type: object
              properties:
                text:
                  type: object
                  properties:
                    used:
                      type: integer
                    available:
                      type: integer
                num:
                  type: object
                  properties:
                    used:
                      type: integer
                    available:
                      type: integer
                bool:
                  type: object
                  properties:
                    used:
                      type: integer
                    available:
                      type: integer
                sel:
                  type: object
                  properties:
                    used:
                      type: integer
                    available:
                      type: integer
                date:
                  type: object
                  properties:
                    used:
                      type: integer
                    available:
                      type: integer
    CFG-01_Request:
      type: object
      properties:
        parsed_config_path:
          type: string
          description: FileStorage path to the parsed config JSON file. Written by an upstream parse step.
        form_field_limit:
          type: integer
          description: Maximum visible fields supported by the manual-input form. Passes through the connector's
            'validate_config' action.
      required:
      - parsed_config_path
    CFG-01_Response:
      type: object
      properties:
        status:
          type: string
          description: valid | invalid
        error_count:
          type: integer
        warning_count:
          type: integer
        checks:
          type: array
          items:
            type: object
            properties:
              check_name:
                type: string
                description: 'One of: lookup_references, depends_on_references, rule_target_field_exists,
                  rule_condition_field_exists, variant_field_exists, user_supplier_exists, exactly_one_primary_user_per_supplier,
                  dependent_dropdown_has_parent, no_duplicate_field_names, no_duplicate_supplier_names,
                  no_duplicate_user_per_supplier, no_duplicate_lookup_entries, required_fields_present,
                  variant_count_matches, form_field_limit, internal_notation_valid, email_format_valid,
                  parsed_config_parseable (synthetic)'
              c_status:
                type: string
                description: pass | fail | warn
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    entity:
                      type: string
                    name:
                      type: string
                    issue:
                      type: string
        warnings:
          type: array
          items:
            type: object
            properties:
              check_name:
                type: string
                description: 'One of: lookup_references, depends_on_references, rule_target_field_exists,
                  rule_condition_field_exists, variant_field_exists, user_supplier_exists, exactly_one_primary_user_per_supplier,
                  dependent_dropdown_has_parent, no_duplicate_field_names, no_duplicate_supplier_names,
                  no_duplicate_user_per_supplier, no_duplicate_lookup_entries, required_fields_present,
                  variant_count_matches, form_field_limit, internal_notation_valid, email_format_valid,
                  parsed_config_parseable (synthetic)'
              c_status:
                type: string
                description: pass | fail | warn
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    entity:
                      type: string
                    name:
                      type: string
                    issue:
                      type: string
      required:
      - status
    DASH-01_Request:
      type: object
      properties:
        template_version_id:
          type: string
          description: Resolves Project, which carries 'spreadsheet_id' for the workbook.
      required:
      - template_version_id
    DASH-01_Response:
      type: object
      properties:
        ok:
          type: boolean
          description: True on success.
        error:
          type: string
          description: Empty on success; populated with reason on failure.
        rows_written:
          type: integer
          description: Per-tab row count actually written
      required:
      - ok
    INC-01_Request:
      type: object
      properties:
        index:
          type: object
          properties:
            index_key:
              type: string
          required:
          - index_key
        seed_data_attributes:
          type: object
          properties:
            file_type:
              type: string
              description: 'Enum: ''drive_file_id'' || ''upload'''
            sheet_name:
              type: string
            drive_id:
              type: string
              description: Drive ID (if supplied as a Drive file)
            file_storage_path_existing:
              type: string
              description: Existing location in FileStorage
          required:
          - file_type
          - sheet_name
        client_name:
          type: string
      required:
      - index
      - client_name
    INC-01_Response:
      type: object
      properties:
        ok:
          type: boolean
        error_message:
          type: string
          description: Nullable if 'ok' === True
        counts:
          type: object
          properties:
            matched_count:
              type: integer
            unmatched_count:
              type: integer
            ambiguous_count:
              type: integer
            unmatched_keys:
              type: string
        ambiguous_keys:
          type: array
          items:
            type: object
            properties:
              seed_value:
                type: string
              supplier_request_ids:
                type: array
        matched:
          type: array
          items:
            type: object
            properties:
              seed_value:
                type: string
              supplier_id:
                type: string
              supplier_name:
                type: string
              supplier_request_id:
                type: string
        unmatched:
          type: array
        integration_results:
          type: array
          items:
            type: object
            properties:
              supplier_name:
                type: string
              supplier_id:
                type: string
                description: PK (SUP_Supplier)
              supplier_request_id:
                type: string
                description: PK (SUP_SupplierRequest)
              ok:
                type: boolean
              error_message:
                type: string
                description: Nullable if 'ok'==True
              error_details:
                type: object
                properties:
                  workato_error_uuid:
                    type: string
                  error_action:
                    type: string
                  msg:
                    type: string
                  error_step_number:
                    type: integer
            required:
            - supplier_name
            - ok
      required:
      - ok
    INC-02_Request:
      type: object
      properties:
        supplier:
          type: object
          properties:
            supplier_request_id:
              type: string
              description: Primary key to the data table, SUP_SupplierRequest.
            supplier_id:
              type: string
              description: Primary key to the data table, SUP_Supplier.
            supplier_name:
              type: string
              description: Human-readable supplier name.
          required:
          - supplier_request_id
          - supplier_id
        seed_data:
          type: object
          properties:
            index:
              type: object
              properties:
                match_value:
                  type: string
                index_key:
                  type: string
                  description: Key upon which the data should be filtered. Typically, 'supplier_name'.
              required:
              - match_value
              - index_key
            seed_data_file_path:
              type: string
              description: Path to the seed data file in Workato FileStorage.
          required:
          - index
          - seed_data_file_path
        seeded_template_filename:
          type: string
          description: File name (with extension) of the integrated template (on success).
      required:
      - supplier
      - seed_data
      - seeded_template_filename
    INC-02_Response:
      type: object
      properties:
        ok:
          type: boolean
        error_message:
          type: string
          description: Nullable if 'ok'==True
        error_details:
          type: object
          properties:
            workato_error_uuid:
              type: string
            error_action:
              type: string
            msg:
              type: string
            error_step_number:
              type: integer
      required:
      - ok
    INV-01_Request:
      type: object
      properties:
        supplier_request_id:
          type: string
        analyst_email:
          type: string
      required:
      - supplier_request_id
      - analyst_email
    INV-01_Response:
      type: object
      properties:
        transitioned:
          type: boolean
        assignee_disposition:
          type: string
          description: sent | failed | already_invited
        secondary_dispositions:
          type: array
          items:
            type: object
            properties:
              disposition:
                type: string
              secondary_user_email:
                type: string
