x-request-write-paths:
  description: Two distinct mechanisms mutate the supplier-request record, both hitting the same row.
    (1) Data Table actions (workato_db_table) address it by table_id + record id and own the user-defined
    columns including SUP_SupplierRequest.status (the state-machine column). (2) Workflow App actions
    (workato_workflow_task) address the request by app_id + record_id; per the app config the MARS RC
    Data Collection app is backed by SUP_SupplierRequest, and these actions write WFA-native fields (CURRENT_STAGE
    / CURRENT_TASK / ASSIGNED_TO) that are NOT in the data-table schema and are separate from the .status
    column.
  via_data_table:
  - recipe: UPL-01
    action: update_record
    access: WRITE(update)
  - recipe: INC-02
    action: update_record
    access: WRITE(update)
  - recipe: REV-01
    action: update_record
    access: WRITE(update)
  - recipe: STS-01
    action: update_record
    access: WRITE(update)
  - recipe: SUP-01
    action: create_records_batch
    access: WRITE(create-batch)
  - recipe: SUP-02
    action: add_record
    access: WRITE(create)
  - recipe: VAL-01
    action: update_record
    access: WRITE(update)
  via_workflow_app:
  - recipe: UPL-01
    action: complete_task
    op: update
  - recipe: UPL-01
    action: share_request
    op: share
  - recipe: INV-01
    action: share_request
    op: share
  - recipe: INV-01A
    action: human_review_on_existing_record
    op: update
  - recipe: INV-USER
    action: share_request
    op: share
  - recipe: PRV-04
    action: add_request
    op: create
x-status-writers:
  description: The state machine runs on SUP_SupplierRequest.status (uuid 84d52734-..., a free-text column
    with no DB-level enum, so recipe discipline is the only thing enforcing valid state tokens). This
    is distinct from the Workflow App task/stage status (CURRENT_TASK / CURRENT_STAGE), which is WFA-native
    and not in the table schema. Column names resolved from the SUP_SupplierRequest data-table trigger
    (UPL-01).
  state_machine_status_column: SUP_SupplierRequest.status
  writes_state_machine_status:
  - recipe: STS-01
    action: update_record
    write_kind: update
    all_columns_written:
    - current_state_entered_at
    - status
    - supplier_display_status
    - supplier_message
  - recipe: SUP-02
    action: add_record
    write_kind: create
    all_columns_written:
    - assigned_variant_id
    - assigned_version_id
    - assignee_email
    - current_state_entered_at
    - has_seeded_data
    - last_reminder_tier
    - reminders_enabled
    - status
