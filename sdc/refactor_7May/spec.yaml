x-request-write-paths:
  description: 'Two distinct mechanisms mutate the supplier-request record, both hitting the same row. (1) Data
    Table actions (workato_db_table) address it by table_id + record id and own the user-defined columns including
    SUP_SupplierRequest.status (the state-machine column). (2) Workflow App actions (workato_workflow_task) address
    the request by app_id + record_id; per the app config the MARS RC Data Collection app is backed by SUP_SupplierRequest,
    and these actions write WFA-native fields (CURRENT_STAGE / CURRENT_TASK / ASSIGNED_TO) that are NOT in the data-table
    schema and are separate from the .status column. CHANGE FROM v1: WFA add_request and update_request actions
    carry a `parameters` payload of data-table column UUIDs, so the workflow-app path now ALSO writes user-defined
    columns: REQ-01 and SUP-02 create the SUP_SupplierRequest row (including .status) via add_request, and REV-01
    writes approved_at/approved_path via update_request. The clean data-table/WFA separation described in v1 no
    longer holds.'
  via_data_table:
  - recipe: INC-02
    action: update_record
    access: WRITE(update)
  - recipe: STS-01
    action: update_record
    access: WRITE(update)
  - recipe: SUP-01
    action: create_records_batch
    access: WRITE(create-batch)
  - recipe: UPL-01
    action: update_record
    access: WRITE(update)
  - recipe: VAL-01
    action: update_record
    access: WRITE(update)
  via_workflow_app:
  - recipe: INV-01
    action: share_request
    op: share
  - recipe: INV-01A
    action: complete_task
    op: update
  - recipe: INV-01A
    action: unshare_request
    op: unshare
  - recipe: INV-01A
    action: human_review_on_existing_record
    op: update
  - recipe: INV-USER
    action: share_request
    op: share
  - recipe: REQ-01
    action: add_request
    op: create
    sets_columns: &id001
    - assigned_variant_id
    - assigned_version_id
    - assignee_email
    - current_state_entered_at
    - has_seeded_data
    - last_reminder_tier
    - reminders_enabled
    - status
    - submission_attempt
    - supplier_display_status
    - supplier_id
    - supplier_message
    - supplier_request_id
    - template_path
  - recipe: REV-01
    action: complete_task
    op: update
  - recipe: REV-01
    action: update_request
    op: update
    sets_columns: &id005
    - approved_at
    - approved_path
  - recipe: SUP-02
    action: add_request
    op: create
    sets_columns: &id002
    - assigned_variant_id
    - assigned_version_id
    - assignee_email
    - current_state_entered_at
    - has_seeded_data
    - last_reminder_tier
    - reminders_enabled
    - status
    - submission_attempt
    - supplier_display_status
    - supplier_id
    - supplier_request_id
    - template_path
  - recipe: UPL-01
    action: complete_task
    op: update
  - recipe: UPL-01
    action: share_request
    op: share
x-status-writers:
  description: The state machine runs on SUP_SupplierRequest.status (uuid 84d52734-..., a free-text column with
    no DB-level enum, so recipe discipline is the only thing enforcing valid state tokens). This is distinct from
    the Workflow App task/stage status (CURRENT_TASK / CURRENT_STAGE), which is WFA-native and not in the table
    schema. Column names resolved from data-table extended output schemas in the export.
  state_machine_status_column: SUP_SupplierRequest.status
  writes_state_machine_status:
  - recipe: REQ-01
    action: add_request
    write_kind: create (via workflow_app add_request)
    all_columns_written: *id001
  - recipe: STS-01
    action: update_record
    write_kind: update
    all_columns_written:
    - current_state_entered_at
    - status
    - supplier_display_status
    - supplier_message
  - recipe: SUP-02
    action: add_request
    write_kind: create (via workflow_app add_request)
    all_columns_written: *id002
  writes_supplier_display_status:
  - recipe: REQ-01
    action: add_request (via workflow_app)
  - recipe: STS-01
    action: update_record
  - recipe: SUP-02
    action: add_request (via workflow_app)
  batch_create_indeterminate:
  - recipe: SUP-01
    action: create_records_batch
    note: batch payload is a list pill; per-column writes not statically visible — may set status at creation
  writes_wfa_task_status:
  - recipe: INV-01A
    action: complete_task
    sets: &id003
    - status
  - recipe: REV-01
    action: complete_task
    sets: &id004
    - status
  - recipe: UPL-01
    action: complete_task
    sets: &id006
    - status
    - status_label
  writes_wfa_stage:
  - recipe: INV-01A
    action: human_review_on_existing_record
    sets:
    - workflow_stage_id
  - recipe: REQ-01
    action: add_request
    sets:
    - workflow_stage_id
  - recipe: SUP-02
    action: add_request
    sets:
    - workflow_stage_id
