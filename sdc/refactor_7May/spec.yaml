openapi: 3.1.0
info:
  title: SDC Platform — Workato Recipe Specification
  version: 2.0.0
  description: 'Machine- and human-readable specification of the Supplier Data Collection (SDC) Workato application,
    derived directly from recipe JSON (v2.0.0 regeneration).


    Entry points appear under `paths`: API Platform HTTP endpoints (`x-trigger-type: api_platform_http`, secured
    by the API-TOKEN header) and Workato webhooks (`x-trigger-type: workato_webhook`, secured by the webhook URL
    suffix). Other recipes are internal: callable recipe functions (invoked via `call_recipe`), Workflow App functions
    (invoked by the WFA portal runtime; see `wfa_function_type` = generic / load_table / load_dropdown), and data-table
    real-time triggers (`x-trigger-type: data_table_realtime`, fired by row changes — see `trigger_table`). Every
    recipe is fully described under the `x-recipes` vendor extension and shares request/response object schemas
    in `components/schemas`.


    Covers all 58 supplied recipes (complete export). The call graph is closed except for one call in WFA-014 targeting
    a recipe named ''UPL-XX'' (zip path Recipes/upl_xx.recipe.json, passing only supplier_request_id) that is NOT
    present in this export — either the export is incomplete or WFA-014 points at a placeholder; resolve at source.
    The prior spec''s unresolved raw call in PRV-04 (flow_id:2066426) no longer exists: PRV-04 now calls the named
    recipe REQ-01.


    Three recipe-code collisions are flagged with `code_collision: true` and disambiguated with a `--<slug>` suffix:
    WFA-013 (carried forward from v1), UTL-04 (new), and WFA-016 (new). One recipe (''WFA Surface supplier, request,
    user projection'') carries no numeric code at all. Renumber all four at source.


    Note on columns: data-table actions reference columns by UUID; this regeneration resolves UUIDs to column names
    via the extended output schemas embedded in the export, so column-level write lists in x-status-writers are
    by name.'
x-generated: '2026-07-02'
x-provenance: Derived from the 2026-07-02 workspace recipe JSON export (Archive.zip, 58 *.recipe.json files); recipe
  JSON is the sole source of truth.
